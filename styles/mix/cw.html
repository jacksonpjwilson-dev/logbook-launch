<!doctype html><meta charset=utf-8><link rel=stylesheet href=mix.css><style>body{margin:0;padding:24px;background:#16161a;color:#eee;font-family:-apple-system,sans-serif;width:1400px}#g{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.c{background:#222;border-radius:16px;padding:12px}h3{margin:0;font-size:16px}small{color:#999}.two{display:flex;flex-direction:column;gap:8px;margin-top:8px}h1{margin:0 0 16px}</style><h1>Logbook colourways</h1><div id=g></div><script src=mix.js></script><script>g.innerHTML=Object.keys(C).filter(k=>k>0).map(k=>`<div class=c><h3>${k}. ${C[k].n}</h3><small>${C[k].pair}</small><div class=two>${sample(k,0)}${sample(k,1)}</div></div>`).join("")</script>
